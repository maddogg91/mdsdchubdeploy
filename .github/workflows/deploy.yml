name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build client
        run: npm run build

      # Requires a repo secret named GCP_SA_KEY containing the JSON key of a
      # service account with the "App Engine Deployer" and "App Engine Service
      # Admin" IAM roles (or equivalent) on the target GCP project. This
      # workflow will fail until that secret is added -- see DEPLOY.md.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to App Engine
        uses: google-github-actions/deploy-appengine@v2
        with:
          deliverables: app.yml
